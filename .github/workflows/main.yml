name: Deploy Schema Architect to Basezap

on:
  push:
    branches: [ main ]
    paths:
      - 'schema-architect/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        working-directory: schema-architect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm ci || npm install
          npm run build

      - name: Upload to Basezap via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: schema-architect/dist/
          server-dir: domains/ctrblaze.com/public_html/seo-schema-architect/
          dangerous-clean-slate: false
