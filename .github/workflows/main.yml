name: Deploy SEO Tools to Basezap

on:
  push:
    branches: [ main ]
    paths:
      - 'schema-architect/**'
      - 'page-template-identifier/**'

jobs:
  deploy-schema-architect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Schema Architect Changed
        id: check_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - 'schema-architect/**'

      - name: Setup Node.js
        if: steps.check_changes.outputs.src == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'schema-architect/package-lock.json'

      - name: Install Dependencies
        if: steps.check_changes.outputs.src == 'true'
        working-directory: schema-architect
        run: npm ci

      - name: Build Project
        if: steps.check_changes.outputs.src == 'true'
        working-directory: schema-architect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: FTP Deploy Schema Architect
        if: steps.check_changes.outputs.src == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: schema-architect/dist/
          server-dir: public_html/seo-schema-architect/
          dangerous-clean-slate: false

  deploy-page-template-identifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Page Template Identifier Changed
        id: check_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - 'page-template-identifier/**'

      - name: Setup Node.js
        if: steps.check_changes.outputs.src == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'page-template-identifier/package-lock.json'

      - name: Install Dependencies
        if: steps.check_changes.outputs.src == 'true'
        working-directory: page-template-identifier
        run: npm ci

      - name: Build Project
        if: steps.check_changes.outputs.src == 'true'
        working-directory: page-template-identifier
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: FTP Deploy Page Template Identifier
        if: steps.check_changes.outputs.src == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: page-template-identifier/dist/
          server-dir: public_html/page-template-identifier/
          dangerous-clean-slate: false
