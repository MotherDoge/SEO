name: Deploy Page Template Identifier

on:
  push:
    branches: [ main ]
    paths:
      - 'page-template-identifier/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'page-template-identifier/package-lock.json'

      - name: Install Dependencies
        working-directory: page-template-identifier
        run: npm ci

      - name: Build Project
        working-directory: page-template-identifier
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: FTP Deploy to Basezap
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: page-template-identifier/dist/
          server-dir: public_html/page-template-identifier/
          dangerous-clean-slate: false
